<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F0B08" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Rove" />
    <!-- "black": the home-screen app starts below an opaque status bar. With
         "black-translucent", iOS 26 blurs the top of the app (Liquid Glass edge
         effect) and lays a cold launch out short of the bottom. iOS reads this
         only when the icon is added, so existing installs must be re-added. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Rove</title>
    <meta name="description" content="Plan, split and share your group trip." />
  </head>
  <body>
    <div class="status-shield" aria-hidden="true"></div>
    <div class="status-fade" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
